plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.waypoint.copilot'
    compileSdk 34

    defaultConfig {
        applicationId "com.waypoint.copilot"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    // One fixed key, so every new build installs over the last one.
    signingConfigs {
        debug {
            storeFile file('waypoint-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // The voice model is read straight from the APK, so keep it uncompressed.
    androidResources { noCompress += ['onnx'] }

    packaging {
        jniLibs {
            excludes += ['**/libsherpa-onnx-c-api.so', '**/libsherpa-onnx-cxx-api.so']
        }
    }
}

dependencies {
    // Downloaded by the GitHub workflow (or fetch-voice.sh) into app/libs.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
}
