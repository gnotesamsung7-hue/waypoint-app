name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download offline voice
        run: bash fetch-voice.sh
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Waypoint-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Waypoint-debug
          path: Waypoint-debug.apk
